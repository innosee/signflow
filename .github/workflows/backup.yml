name: Backup Prod-DB → IONOS

# 2×/Woche verschlüsselter Logical-Dump der Prod-DB auf die IONOS-VM.
# Konzept: docs/backups.md. Läuft erst, wenn die Secrets gesetzt sind —
# ohne Secrets bricht der erste Step sauber ab (kein roter Lauf, keine Mails).
#
# Cron ist UTC. 01:00 UTC ≈ 03:00 Europe/Berlin (Sommerzeit CEST); im Winter
# 02:00 CET — bewusst nachts, Last egal.
on:
  schedule:
    - cron: "0 1 * * 1,4" # Montag + Donnerstag
  workflow_dispatch: {} # manueller Test-Trigger

# Nie zwei Backups gleichzeitig.
concurrency:
  group: prod-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # PG-17-Client (pg_dump) passend zur Neon-Server-Version.
    container:
      image: postgres:17
    steps:
      - name: Secrets-Check (sonst sauber überspringen)
        id: gate
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_GPG_PUBLIC_KEY" ] || [ -z "$IONOS_SSH_KEY" ]; then
            echo "Backup-Secrets noch nicht gesetzt — übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Tooling (gpg, ssh, curl, jq)
        if: steps.gate.outputs.skip != 'true'
        run: apt-get update && apt-get install -y --no-install-recommends gnupg openssh-client curl jq ca-certificates

      - name: SSH-Key an festen Pfad schreiben
        if: steps.gate.outputs.skip != 'true'
        env:
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          printf '%s\n' "$IONOS_SSH_KEY" > "$RUNNER_TEMP/ionos_key"
          chmod 600 "$RUNNER_TEMP/ionos_key"

      - name: GPG-Public-Key importieren
        if: steps.gate.outputs.skip != 'true'
        env:
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
        run: printf '%s\n' "$BACKUP_GPG_PUBLIC_KEY" | gpg --import

      - name: Dump + verschlüsseln + Upload
        id: backup
        if: steps.gate.outputs.skip != 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_GPG_RECIPIENT: ${{ vars.BACKUP_GPG_RECIPIENT }}
          BACKUP_TARGET: ssh
          IONOS_SSH_DEST: ${{ vars.IONOS_SSH_DEST }}
          IONOS_SSH_DIR: ${{ vars.IONOS_SSH_DIR }}
          IONOS_SSH_KEY_FILE: ${{ runner.temp }}/ionos_key
          BACKUP_RETENTION: ${{ vars.BACKUP_RETENTION }}
        run: |
          out="$(bash scripts/backup-prod-to-ionos.sh)"
          echo "$out"
          # Letzte Zeile = „✓ Backup abgelegt: …" → als Step-Output für die Mail.
          echo "summary=$(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"

      # Benachrichtigung an den Betreiber bei JEDEM Lauf (Erfolg + Fehler) via
      # Resend — gleiche Quelle wie die App-Mails. RESEND_API_KEY als Secret,
      # Absender/Empfänger als Vars. jq baut den JSON-Body sauber escaped.
      - name: Erfolgs-Mail
        if: success() && steps.gate.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          NOTIFY: ${{ vars.BACKUP_NOTIFY_EMAIL }}
          SUMMARY: ${{ steps.backup.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          html="<p>✅ Prod-Backup erfolgreich abgelegt (IONOS-VM, verschlüsselt).</p><p><code>${SUMMARY}</code></p><p><a href=\"${RUN_URL}\">Run-Log</a></p>"
          body="$(jq -n --arg from "$EMAIL_FROM" --arg to "$NOTIFY" --arg subj "✅ Signflow-Backup OK" --arg html "$html" '{from:$from,to:[$to],subject:$subj,html:$html}')"
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body" -o /dev/null -w "Resend HTTP: %{http_code}\n"

      - name: Fehler-Mail
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          NOTIFY: ${{ vars.BACKUP_NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFY" ]; then echo "keine Mail-Config — skip"; exit 0; fi
          command -v jq >/dev/null 2>&1 || apt-get install -y --no-install-recommends jq curl ca-certificates
          html="<p>🔴 <strong>Prod-Backup FEHLGESCHLAGEN.</strong> Bitte prüfen.</p><p><a href=\"${RUN_URL}\">Run-Log ansehen</a></p>"
          body="$(jq -n --arg from "$EMAIL_FROM" --arg to "$NOTIFY" --arg subj "🔴 Signflow-Backup FEHLGESCHLAGEN" --arg html "$html" '{from:$from,to:[$to],subject:$subj,html:$html}')"
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body" -o /dev/null -w "Resend HTTP: %{http_code}\n"
